# NMR peak-analysis parameters.
#
# Edit this file to change analysis settings between runs instead of passing
# command-line flags. Every value here can still be overridden per-run on the
# command line (e.g. --target 5.8 --no-plots).
#
# Precedence (lowest to highest):  built-in default  <  this file  <  CLI flag
#
# Each script reads the shared [common] section plus its own named section.
# Used by:
#   scripts/nmr/analyze_single.py
#   scripts/nmr/compare_timeseries.py
#   scripts/nmr/batch_report.py

# ---------------------------------------------------------------------------
# Shared by all three scripts.
# ---------------------------------------------------------------------------
common:
  target_ppm: 6.1              # fixed-target scripts only; regional search ignores it
  window_ppm: 0.12            # detection half-window around target_ppm, in ppm
  # null reproduces the processing stored in each DX file ($LB and $SI).
  line_broadening_hz: null
  zero_fill_points: null
  # Target detection uses a clipped polynomial baseline, then requires a
  # prominence at least this many robust-noise standard deviations above it.
  min_prominence_snr: 3.0
  baseline_window_ppm: 0.5
  baseline_polynomial_order: 2
  output_dir: results/analysis # base dir for timestamped result folders
  run_name: null              # fixed output-folder name; null = auto timestamp
  plots: true                 # generate PNG plots

  # Group runs into a sub-folder of output_dir, e.g. by sample type, giving
  #   results/analysis/<group>/<input>_<timestamp>_<script>/
  # `group_tokens` is auto-detection: the first token found (case-insensitive)
  # in the input file names picks the sub-folder — so files named
  # CEC-PhSi2-flow(...).dx land under a "PhSi2" folder. Add/remove tokens here.
  # `group` forces a fixed sub-folder and overrides auto-detection.
  # Both empty / no match → no sub-folder (straight under output_dir).
  group: null
  group_tokens: [PhSi2, PhSi4, PhSi6]

# ---------------------------------------------------------------------------
# analyze_single.py — one file, deep report + review plot.
# ---------------------------------------------------------------------------
analyze_single:
  plot_window_ppm: 0.5        # ppm half-window shown in the review plot

# ---------------------------------------------------------------------------
# compare_timeseries.py — a reaction tracked over time (growth + plateau).
# ---------------------------------------------------------------------------
compare_timeseries:
  plateau_threshold_pct: 5.0  # % change below which a step counts as "flat"
  plateau_consecutive: 2      # consecutive flat steps needed to call plateau

# ---------------------------------------------------------------------------
# batch_report.py — many files, aggregate stats & rankings.
# (No parameters beyond the common section.)
# ---------------------------------------------------------------------------
batch_report: {}

# ---------------------------------------------------------------------------
# plot_spectra.py — visualise the actual spectra (intensity vs ppm):
# per-file plots (full + zoom), an overlay, and a stacked waterfall, each with
# the scipy-detected ~target_ppm peak marked.
# ---------------------------------------------------------------------------
plot_spectra:
  zoom_window_ppm: 0.5        # narrow zoom: target_ppm +/- this (plots/zoom/)
  # Second, wider per-file zoom over an absolute ppm range (plots/zoom_wide/).
  zoom_wide_min_ppm: 5.0
  zoom_wide_max_ppm: 7.0
  normalize_overlay: true     # scale each trace to its own max in the overlay

# Production FID processing. The regional processor searches the full interval
# and does not assume either 5.79 or 6.10 ppm. Reference correction remains
# disabled unless a candidate is explicitly declared and passes every QC gate.
processing:
  phase_method: stored
  # ALS follows and removes the rolling solvent background (the toluene tail the
  # ~5.8 peak sits on), giving a flat baseline near zero like the legacy/vendor
  # plots. 'polynomial' leaves that tail as a negative bowl.
  baseline_method: asymmetric_least_squares
  reference_method: metadata
  zero_fill_points: 65536
  line_broadening_hz: 0.03
  normalization: none

regional_analysis:
  ppm_min: 5.0
  ppm_max: 6.5
  detect_all_peaks: true

reference:
  enabled: false
  method: metadata
  solvent_identity: unknown
  solvent_isotopic_form: unknown
  internal_standard: null
  preserve_original_axis: true
  require_multiple_reference_regions: true
  expected_ppm: null
  search_window_ppm: null
  minimum_snr: null
  minimum_prominence_snr: null
  minimum_width_ppm: 0.002
  maximum_width_ppm: 0.30
  maximum_allowed_shift_ppm: 0.50
  maximum_reference_disagreement_ppm: 0.05

# Expected values are source-qualified in
# chemyx_lab.analysis.nmr.REFERENCE_MODEL_DEFINITIONS. Models remain disabled
# until the actual sample solvent/isotopic form or an internal standard is
# experimentally confirmed.
# ---------------------------------------------------------------------------
# Optional publication-statistics pipeline (process_fid.py --statistics).
#
# OFF by default: with `enabled: false` (or this section absent) process_fid.py
# produces exactly the same outputs as before. When enabled it additionally
# writes peak uncertainty, robust family statistics, run QC, fixed-window
# time-series, rates, statistical plateau, kinetics, and spectral-similarity
# tables. See docs/nmr_statistics.md for every metric's definition and caveats.
# ---------------------------------------------------------------------------
statistics:
  enabled: false

  bootstrap:                    # per-peak uncertainty (residual bootstrap of a fit)
    enabled: true
    iterations: 500             # resamples per peak; deterministic given random_seed
    confidence_level: 0.95
    random_seed: 12345
    model: pseudo_voigt         # gaussian | lorentzian | pseudo_voigt

  internal_standard:            # optional relative-quantitation reference
    enabled: false
    expected_ppm: null          # find the standard near this ppm, or ...
    tolerance_ppm: 0.03
    integration_window_ppm: null  # ... integrate a fixed window, or ...
    peak_family_id: null        # ... reuse an existing peak family as the standard

  fixed_regions:                # chemically-defined windows integrated every spectrum
    - name: candidate_5p79
      left_ppm: 5.70
      right_ppm: 5.90
    - name: candidate_6p10
      left_ppm: 6.00
      right_ppm: 6.20

  outliers:
    enabled: true
    robust_z_threshold: 3.5     # |modified z| above this flags (never deletes) a value

  plateau:
    method: statistical_slope   # slope-CI equivalence test (supersedes %-change rule)
    minimum_points: 4
    equivalence_percent_per_hour: 1.0   # margin as % of mean area per hour
    persistence_points: 3
    allow_declining_plateau: false      # a sustained decline is not "complete"

  kinetics:
    enabled: true
    models:
      - zero_order
      - first_order_decay
      - first_order_formation
      - first_order_formation_lag

  multivariate:
    spectral_similarity: true
    pca: true
    pca_components: 3

reference_models:
  protonated_toluene_low_field_neat:
    enabled: false
    methyl_search_window_ppm: [1.75, 2.55]
    aromatic_search_window_ppm: [6.60, 7.50]

  protonated_toluene_dilute_cdcl3:
    enabled: false
    methyl_search_window_ppm: [1.75, 2.65]
    aromatic_search_window_ppm: [6.60, 7.60]

  toluene_d8_residual:
    enabled: false
    methyl_search_window_ppm: [1.75, 2.40]
    aromatic_search_window_ppm: [6.60, 7.40]
