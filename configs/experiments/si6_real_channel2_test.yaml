# Use ONLY scripts/01_three_instrument_system_test.py with the runbook diagnostic selection.
# The shared sampling-cycle definition is required by the loader; diagnostics do not execute it.
# Small diagnostic: withdraw 0.5 mL, infuse 0.5 mL, both with needle UP; never the 1.8 mL dose.
workflow:
  name: si6_real_channel2_test
  description: Ping all three, then small supervised Channel 2 pump diagnostic.
  initial_needle_position: UP
  cycle:
  - action: withdraw
    channel: 1
    volume_ml: 8.0
    rate_ml_min: 5.0
  - action: operator
    position: DOWN
    prompt: Lower needle.
  - action: withdraw
    channel: 1
    volume_ml: 5.0
    rate_ml_min: 5.0
  - action: pause
    seconds: 10
  - action: nmr
  - action: operator
    position: UP
    prompt: Raise needle.
  - action: infuse
    channel: 1
    volume_ml: 13.0
    rate_ml_min: 5.0
  - action: withdraw
    channel: 1
    volume_ml: 5.0
    rate_ml_min: 5.0
  - action: infuse
    channel: 1
    volume_ml: 5.0
    rate_ml_min: 5.0
  pump_extra_seconds: 2.0
  initial_stage:
    name: hardware_diagnostic
    operator_prompt: Supervised hardware diagnostic.
    interval_minutes: 60
    max_hours: 1
    measure_immediately: true
    plateau_stopping_enabled: false
  repeat_addition_rounds: 0
  repeating_stages: []
pump:
  default_channel: 1
  channels:
    '1':
      syringe_diameter_mm: 20.0
      syringe_capacity_ml: 20.0
      initial_retained_volume_ml: 0.0
      syringe_safety_margin_ml: 1.0
      units: mL/min
      rate_ml_min: 5.0
      default_volume_ml: 5.0
    '2':
      syringe_diameter_mm: 12.06
      syringe_capacity_ml: 5.0
      initial_retained_volume_ml: 2.0
      syringe_safety_margin_ml: 0.2
      units: mL/min
      rate_ml_min: 1.0
      default_volume_ml: 1.8
nmr:
  route: iflow
  result_type: fid
  scans: 2
  receiver_gain: 12.0
  auto_gain: false
  spectral_center: 5.0
  sweep_width: 20.0
  target_ppm: 5.8
analysis:
  detection_window_ppm: 0.1
  integration_window_ppm: 0.1
  plot_window_ppm: 0.5
  line_broadening_hz: 0.3
  min_peak_snr: 5.0
  min_prominence_snr: 3.0
  min_peak_area: 0.0
  area_epsilon: 1.0e-12
  plateau_max_growth_percent: 5.0
  plateau_max_decline_percent: 2.0
  plateau_consecutive_intervals: 3
output:
  run_root_dir: results/runs/si6_real_diagnostics
three_instrument:
  test_withdraw_ml: 0.5
  test_infuse_ml: 0.5
  initial_plateau_stopping_enabled: false
  diagnostic_channel: 2
