# 20 — three instruments (Arduino needle + Chemyx + NMR): Stage 1 (48 h) -> one
# Channel 2 dose -> Stage 2 (6 h). Simple path: no state files, no lockouts.
# Ports, travel range, the sampling recipe (8 + 5 mL, 13 mL return, 5 mL wash) and
# NMR settings come from 21's file, so 20 / 21 / 22 always use the same rig settings.
# Before starting: HOME set with needle_control.py set-home, Channel 1 empty,
# Channel 2 loaded with channel_2.initial_volume_ml, NMR idle.
base_config: configs/experiments/21_stage2only.yaml

# ==========================================
# CHANNEL 2: ONE DOSE BETWEEN STAGE 1 AND STAGE 2 (same values as 14)
# Needle to HOME, Channel 2 infuses, needle back UP.
# ==========================================
channel_2:
  channel: 2
  volume_ml: 1.86
  rate_ml_min: 1.0
  initial_volume_ml: 5.0     # ACTUAL liquid loaded in Channel 2 before starting.
  syringe_diameter_mm: 20.0
  syringe_capacity_ml: 20.0

# ==========================================
# SCHEDULE (same as 14 and 23). Slots are anchored to each stage's start; late slots are skipped.
# ==========================================
stages:
  stage_1:
    duration_minutes: 2880           # 48 h
    interval_minutes: 120            # 24 samples at 0, 2, ... 46 h; then the window runs to 48 h
    include_final_observation: false
  stage_2:                           # Starts when the Channel 2 dose has finished.
    duration_minutes: 360            # 6 h
    interval_minutes: 30             # 13 samples at 0, 0.5, ... 6 h
    include_final_observation: true

# Live review plots, as in 23: one separate process per stage writes
# stage_N/analysis/*.png and peak_areas.csv after each saved spectrum. It never
# controls or delays the run. false = raw data only.
review:
  enabled: true
  processing_config: configs/nmr/analysis.yaml
  target_peak:
    prominence_snr: 8.0
    rel_height: 0.95
    search_low: 5.6
    search_high: 6.0
    expected_ppm: 5.79
