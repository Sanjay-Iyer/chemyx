workflow:
  name: 081626_phsi4
  description: One immediate attended Chemyx/NMR hardware integration run for 081626_phsi4.
  # Balanced production sampling cycle. The single measurement is scheduled
  # immediately; its only deliberate wait is a 10-second settling pause
  # immediately before NMR.
  cycle:
    - action: withdraw
      volume_ml: 8.0
    - action: withdraw
      volume_ml: 5.0
    - action: pause
      seconds: 10
      note: Let the transferred sample settle for ten seconds before starting the NMR acquisition.
    - action: nmr
    - action: infuse
      volume_ml: 13.0
    - action: withdraw
      volume_ml: 5.0
    - action: infuse
      volume_ml: 5.0
  pump_extra_seconds: 2.0

  initial_stage:
    name: 081626_phsi4
    operator_prompt: Confirm the pump path and NMR test sample are ready, then type yes.
    # The schema requires a positive interval, but measure_immediately means the
    # only configured measurement has a zero-second scheduling offset.
    interval_minutes: 1
    measure_immediately: true
    plateau_stopping_enabled: false
    max_measurements: 1
    max_hours: 0.25

  # Do not enter any reaction/addition stages after the one hardware test.
  repeat_addition_rounds: 0
  repeating_stages: []

pump:
  channel: 1
  syringe_diameter_mm: 20.0
  syringe_capacity_ml: 20.0
  initial_retained_volume_ml: 0.0
  syringe_safety_margin_ml: 1.0
  units: mL/min
  rate_ml_min: 10.0
  default_volume_ml: 0.05

nmr:
  route: iflow
  result_type: fid
  scans: 8
  receiver_gain: 12.0
  auto_gain: false
  spectral_center: 5.0
  sweep_width: 20.0
  target_ppm: 6.1

analysis:
  detection_window_ppm: 0.12
  integration_window_ppm: 0.12
  plot_window_ppm: 0.5
  line_broadening_hz: 0.3
  min_peak_snr: 5.0
  min_prominence_snr: 3.0
  min_peak_area: 0.0
  area_epsilon: 1.0e-12
  plateau_max_growth_percent: 5.0
  plateau_max_decline_percent: 2.0
  plateau_consecutive_intervals: 3

output:
  run_root_dir: results/runs/081626_phsi4
