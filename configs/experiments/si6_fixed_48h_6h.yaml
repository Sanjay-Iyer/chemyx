# Separate acquisition-only preset. Production chemistry quantities unchanged.
# Each launch starts directly, without prompts: manually restore both pumps to
# their existing HOME loading (Ch1=0 mL, Ch2=5 mL) BEFORE launching --live.
# Arduino-only set-home defines/logs needle HOME; startup MOVES to that saved HOME,
# then UP. Neither instrument's official HOME is reset. Old dose JSON does not block it.
machine_config: configs/machines/si6_real_COM4.yaml
arduino_config: arduino/configs/arduino_real_COM3.yaml
manual_config: configs/chemyx/manual_control.yaml
stages:
  - {name: stage_1, hours: 48, interval_minutes: 120}
  - {name: stage_2, hours: 6, interval_minutes: 30}
workflow:
  initial_needle_position: UP
  pump_extra_seconds: 2.0
  cycle:
    - {action: withdraw, channel: 1, volume_ml: 8.0, rate_ml_min: 5.0}
    - {action: needle, position: HOME}
    - {action: withdraw, channel: 1, volume_ml: 5.0, rate_ml_min: 5.0}
    - {action: pause, seconds: 10}
    - {action: nmr}
    - {action: needle, position: UP}
    - {action: infuse, channel: 1, volume_ml: 13.0, rate_ml_min: 5.0}
    - {action: withdraw, channel: 1, volume_ml: 5.0, rate_ml_min: 5.0}
    - {action: infuse, channel: 1, volume_ml: 5.0, rate_ml_min: 5.0}
  dose: {channel: 2, volume_ml: 1.86, rate_ml_min: 1.0}
pump:
  default_channel: 1
  channels:
    '1': {syringe_diameter_mm: 20.0, syringe_capacity_ml: 20.0, initial_retained_volume_ml: 0.0, syringe_safety_margin_ml: 1.0, units: mL/min, rate_ml_min: 5.0, default_volume_ml: 5.0}
    '2': {syringe_diameter_mm: 20.0, syringe_capacity_ml: 20.0, initial_retained_volume_ml: 5.0, syringe_safety_margin_ml: 0.2, units: mL/min, rate_ml_min: 1.0, default_volume_ml: 1.86}
nmr:
  route: iflow
  result_type: fid
  scans: 8
  receiver_gain: 12.0
  auto_gain: false
  spectral_center: 5.0
  sweep_width: 20.0
retrieval_wait_seconds: 20
output:
  run_root_dir: results/fixed_time
