# 21 — three-instrument Stage 2 only (simple; was 15, replaces 12). Also the base settings for 20 and 22.
# No needle_state.json, journals, pump ledgers or lockouts. The needle position
# is the same plain-integer file pair that needle_control.py uses.
# Before starting: HOME set with needle_control.py set-home, Channel 1 syringe
# empty, NMR idle with NMReady open.
experiment:
  duration_minutes: 360
  interval_minutes: 15
  include_final_observation: true   # 25 slots: 0, 15, ... 360 minutes.

arduino:
  port: COM3
  baud_rate: 115200
  steps_per_unit: 200          # One UP/DOWN increment, as in the manual script.
  up_step_sign: 1
  speed_steps_s: 100
  acceleration_steps_s2: 500
  min_position: -3             # Travel range in increments; HOME = 0.
  max_position: 5
  up_position: 1               # Raised position between samples.
  position_file: runs/arduino/simple_needle_position.txt  # Shared with needle_control.py.

chemyx:
  port: COM4                   # Change to COM6 if the pump is there.
  baud_rate: 115200
  timeout_seconds: 2
  response_delay_seconds: 0.2
  channel: 1
  syringe_diameter_mm: 20.0
  syringe_capacity_ml: 20.0
  pre_sample_volume_ml: 8.0    # Withdrawn with the needle UP.
  sample_volume_ml: 5.0        # Withdrawn at HOME (needle DOWN).
  sample_rate_ml_min: 5.0
  return_rate_ml_min: 5.0      # Returns all 13 mL with the needle UP.
  wash_volume_ml: 5.0          # Then 5 mL out and back.
  wash_rate_ml_min: 5.0
  settle_seconds: 10           # Wait after sampling, before the NMR scan.
  extra_seconds: 2             # Added to each timed transfer before STOP.

# ==========================================
# OPTIONAL CHANNEL 2 DOSE (21 only; 20 always doses between its stages)
# ==========================================
# enabled: true -> once the time-0 sample has finished (sample returned, washed),
# wait delay_after_time_zero_seconds, then: needle to HOME, Channel 2 infuses
# volume_ml at rate_ml_min, needle UP. Then 21 waits for the next sample as usual.
# The schedule does not move: a sample whose time passes during the dose is
# skipped. 20 has its own channel_2 section (its dose is between stages); 22 never doses.
channel_2:
  enabled: false
  channel: 2
  volume_ml: 1.86
  rate_ml_min: 1.0
  delay_after_time_zero_seconds: 180   # 3 minutes
  initial_volume_ml: 5.0     # ACTUAL liquid loaded in Channel 2 before starting.
  syringe_diameter_mm: 20.0
  syringe_capacity_ml: 20.0

nmr:
  host: 169.254.30.54
  port: 5000
  scheme: http
  http_timeout_seconds: 10
  acquisition_timeout_seconds: 300  # Per scan: setup, acquisition and retrieval.
  poll_seconds: 2
  scans: 8
  gain: 12
  auto_gain: false
  center_ppm: 5
  width_ppm: 20

# Background full-spectrum / target-peak plots after each saved file (also 22).
# Review outputs never control the instruments. 21 also keeps its final 09 report.
review:
  enabled: true
  processing_config: configs/nmr/analysis.yaml
  target_peak:
    prominence_snr: 8.0
    rel_height: 0.95
    search_low: 5.6
    search_high: 6.0
    expected_ppm: 5.79

output:
  root_dir: results/experiments
