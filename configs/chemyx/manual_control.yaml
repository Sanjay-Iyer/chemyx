# Chemyx Fusion 4000 standalone manual control and custom software HOME.
# Used by scripts/chemyx_control.py and scripts/chemyx_home.py.
# Guide: docs/02_chemyx/02_manual_control_and_home.md
#
# This file defines the HOME *convention* and manual operating settings.
# The actual HOME establishment and current plunger displacement live in the
# runtime ledger (runtime/chemyx_state/), never here. Editing a value that a
# saved HOME depends on (syringe diameter/capacity, reference description,
# syringe volume at HOME, COM port) does NOT silently move or reset the
# reference: HOME return is refused until you restore the old value or
# physically re-establish HOME with set-home.

# COM port: change the Chemyx serial port in this machine file
# (si6_real_COM4.yaml uses COM4; point at si6_real_COM6.yaml for COM6).
# Use the same machine file for the automated experiment, otherwise its moves
# are recorded against a different pump and HOME tracking becomes UNKNOWN.
machine_config: configs/machines/si6_real_COM4.yaml

# Syringe diameter/capacity set to null below are read from this experiment
# recipe. Explicit values must match it, otherwise the experiment's moves make
# that channel's HOME tracking UNKNOWN (verify warns about any difference).
syringe_config: configs/experiments/si6_real_two_stage.yaml

# Experiment reagent-dose reservations. Read only; Channel 2 motion respects them.
dose_ledger_dir: runtime/si6_doses

channels:
  # Channel: the keys 1 and 2 are the Chemyx channel numbers.
  1:
    name: sampling
    syringe:
      # Syringe inner diameter in mm (null = use syringe_config). 20.0 mm is
      # what the real rig ran with on 2026-08-10 (03_081626_phsi4.yaml) and
      # matches si6_real_two_stage.yaml. VERIFY against the installed syringe.
      diameter_mm: 20.0
      # Usable syringe capacity in mL (null = use syringe_config).
      capacity_ml: 20.0
    home:
      # false disables set-home and home for this channel.
      enabled: true
      # The physical position the operator places the plunger at before set-home.
      reference_description: "Plunger fully depressed"
      # Syringe contents (mL) when the plunger is at HOME; 0.0 = fully depressed.
      # Used to keep manual infuse/withdraw inside the syringe. null disables
      # manual infuse/withdraw for this channel (HOME return still works).
      syringe_volume_at_home_ml: 0.0
    manual_transfer:
      # Default volume per manual infuse/withdraw command (mL) and the rate for
      # every manual move on this channel, including HOME return (mL/min).
      volume_ml: 1.0
      rate_ml_min: 10.0

  2:
    name: reagent_dosing
    syringe:
      # Same 20 mL syringe as Channel 1 (operator setting, 2026-10-16), matching
      # si6_real_two_stage.yaml. VERIFY against the installed syringe.
      diameter_mm: 20.0
      capacity_ml: 20.0
    home:
      enabled: true
      # HOME = the experiment's starting state: 5.0 mL reagent loaded, as in
      # si6_real_two_stage.yaml (pump.channels.2.initial_retained_volume_ml).
      # After the 1.86 mL dose, HOME return is a 1.86 mL withdrawal.
      reference_description: "Loaded with 5.0 mL reagent (experiment start)"
      syringe_volume_at_home_ml: 5.0
    manual_transfer:
      # Default volume per command (mL) and rate, including HOME return (mL/min).
      # A move is refused if it would leave the syringe below empty or above capacity.
      volume_ml: 1.0
      rate_ml_min: 10.0
