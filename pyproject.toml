[project]
name = "chemyx-lab"
version = "0.1.0"
description = "Chemyx Fusion 4000X pump and NMR workflow helpers"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
