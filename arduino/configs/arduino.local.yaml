# DEMO-READY Arduino needle config (work laptop 2: Arduino on COM3).
# Every value is filled in so manual jog, Tests 1-3, needle_control, and the
# 01/02 three-instrument workflows run immediately. Keep the 24 V driver
# switch within reach; there are no limit switches or encoder.
arduino:
  port: COM3
  baud_rate: 115200
  expected_device: needle_controller
  expected_board: uno_r4_minima
  expected_version: 1.2.1
  ready_timeout_s: 5.0
  read_timeout_s: 0.1
  write_timeout_s: 1.0
  command_timeout_s: 10.0
  overall_timeout_s: 59.0
  fingerprint: {} # no USB identity check; the firmware READY check still runs

firmware:
  motion_enabled: true
  limits_enabled: false
  runtime_configurable: true
  version: 1.2.1

signal_interface:
  installed: true
  interface_type: direct_validated_bridge # D3 STEP / D4 DIR
  wiring_reviewed: true
  signal_inverted: false
  dm542_signal_voltage_v: null

motor:
  model: null
  rated_phase_current_a: null
  full_steps_per_revolution: null
  coil_pairs_identified: true
  mechanically_disconnected_for_test_02: true
  connected_to_axis_for_test_03: true

driver:
  model: DM542S
  supply_voltage_v: 24
  supply_current_a: null
  current_switch_setting: null
  microstep_setting: null
  microsteps_per_full_step: null
  enable_active_low: null # unused; ENA is not wired

motion:
  maximum_speed_steps_s: 100        # firmware cap is 100
  maximum_acceleration_steps_s2: 500
  test_02_steps: 200                # Test 2 forward/back distance
  test_02_speed_steps_s: 100

needle:
  # HOME=0 is wherever the needle is when position is unknown (auto-assumed).
  min_position: -3
  max_position: 5
  home_position: 0
  up_position: 1                    # UP = +1 unit above HOME
  down_position: -1                 # DOWN = -1 unit below HOME (in the liquid)
  steps_per_unit: 200               # 200 steps = the proven 90-degree bench move
  up_step_sign: 1                   # +1: manual-up direction (DIR LOW) is UP; -1 to flip
  state_path: runs/arduino/needle_state.json

safety:
  fuse_installed: false
  emergency_disconnect_documented: true
  mechanical_hard_stops_installed: false
  vertical_axis_safe_when_disabled: true
  hard_runtime_limit_s: 120
  operator_shaft_safe_confirmed: true
  operator_inspection_required: false
  operator_inspection_clearance: demo

results:
  run_root_dir: runs/arduino
