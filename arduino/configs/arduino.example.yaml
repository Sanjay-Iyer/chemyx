# Connection example from the 2026-09-23 home-laptop port listing. Verify COM3
# on each laptop; null calibration/motion values below intentionally block
# physical movement until measured and reviewed on the actual rig.
arduino:
  port: COM3 # Update if this laptop assigns the Arduino another COM port.
  baud_rate: 115200
  expected_device: needle_controller
  expected_board: uno_r4_minima
  expected_version: 1.2.1
  ready_timeout_s: 5.0
  read_timeout_s: 0.1
  write_timeout_s: 1.0
  command_timeout_s: 10.0
  overall_timeout_s: 59.0
  fingerprint:
    vid: 0x2341 # Observed Arduino USB VID on home laptop; verify per device.
    pid: 0x0069 # Observed Arduino USB PID on home laptop; verify per device.
    serial_number: null # Optional; do not guess another device's serial.
    manufacturer: null # Optional; do not guess this string.

firmware:
  motion_enabled: false
  limits_enabled: false
  runtime_configurable: true
  version: 1.2.1

signal_interface:
  # Review the already-validated D3 STEP / D4 DIR wiring. No new interface
  # or additional GPIO connections are required for this supervised demo.
  installed: false
  interface_type: direct_validated_bridge
  wiring_reviewed: false
  signal_inverted: false
  dm542_signal_voltage_v: null

motor:
  model: null
  rated_phase_current_a: null
  full_steps_per_revolution: null
  coil_pairs_identified: false
  mechanically_disconnected_for_test_02: false
  connected_to_axis_for_test_03: false

driver:
  model: DM542S
  supply_voltage_v: 24
  supply_current_a: null
  current_switch_setting: null
  microstep_setting: null
  microsteps_per_full_step: null
  enable_active_low: null # unused; ENA is not wired

motion:
  # Firmware 1.2.1 preserves the proven bridge timing: at most 100 steps/s.
  maximum_speed_steps_s: null
  maximum_acceleration_steps_s2: null
  test_02_steps: null
  test_02_speed_steps_s: null

needle:
  # HOME is a manually confirmed software reference, not a switch position.
  min_position: -3
  max_position: 5
  home_position: 0
  up_position: 1
  down_position: -1
  # Set only after reviewing the existing 90-degree = 200-step bench move
  # against the real needle clearance. Do not assume this example is safe.
  steps_per_unit: null
  # Legacy bridge positive/forward drives DIR LOW. Verify whether that is UP.
  up_step_sign: null
  state_path: runs/arduino/needle_state.json

safety:
  fuse_installed: false
  emergency_disconnect_documented: false
  mechanical_hard_stops_installed: false
  vertical_axis_safe_when_disabled: null
  hard_runtime_limit_s: 120
  operator_shaft_safe_confirmed: false
  operator_inspection_required: false
  # After any failed live motion, document inspection here with a new unique
  # reference; changing it intentionally invalidates earlier fingerprints.
  operator_inspection_clearance: null

results:
  run_root_dir: runs/arduino
