# Historical offline regression fixture; NOT a live hardware profile.
# Editable starting criteria, NOT validated chemistry calibration.
# Verify syringes, needle geometry, tubing and thresholds on WORK before live use.
workflow:
  name: si6_two_stage
  description: Decreasing target, one reagent addition, conservative increasing plateau.
  experiment_id: SET_UNIQUE_EXPERIMENT_ID
  initial_needle_position: UP
  cycle:
    - {action: withdraw, channel: 1, volume_ml: 8.0, rate_ml_min: 5.0}
    - {action: operator, position: DOWN, prompt: Lower needle.}
    - {action: withdraw, channel: 1, volume_ml: 5.0, rate_ml_min: 5.0}
    - {action: pause, seconds: 300}
    - {action: nmr}
    - {action: infuse, channel: 1, volume_ml: 13.0, rate_ml_min: 5.0}
    - {action: operator, position: UP, prompt: Raise needle.}
    - {action: withdraw, channel: 1, volume_ml: 5.0, rate_ml_min: 5.0}
    - {action: infuse, channel: 1, volume_ml: 5.0, rate_ml_min: 5.0}
  pump_extra_seconds: 2.0
  initial_stage:
    name: stage_1
    operator_prompt: Confirm rig at rest, loaded syringes and readiness for Stage 1.
    interval_minutes: 120
    max_hours: 48
    measure_immediately: true
    plateau_stopping_enabled: true
    completion:
      trend: decreasing
      minimum_points: 8
      minimum_duration_hours: 12
      window_points: 4
      consecutive_confirmations: 3
      minimum_progress_fraction: 0.95
      low_fraction: 0.025
      max_window_range_fraction: 0.01
      max_abs_slope_fraction_per_hour: 0.001
    after_monitoring:
      - {action: needle, position: DOWN}
      - {action: infuse, channel: 2, volume_ml: 1.8, rate_ml_min: 1.0, needle_position: DOWN}
      - {action: needle, position: UP}
  first_addition_stage:
    name: stage_2
    operator_prompt: Confirm dose evidence and readiness for Stage 2.
    interval_minutes: 30
    max_hours: 6
    measure_immediately: true
    plateau_stopping_enabled: true
    completion:
      trend: increasing
      expected_duration_hours: 3
      minimum_points: 8
      minimum_duration_hours: 3
      window_points: 5
      consecutive_confirmations: 3
      minimum_progress_fraction: 0.25
      max_window_range_fraction: 0.02
      max_abs_slope_fraction_per_hour: 0.012
  repeat_addition_rounds: 0
  repeating_stages: []
pump:
  default_channel: 1
  channels:
    "1":
      syringe_diameter_mm: 20.0
      syringe_capacity_ml: 20.0
      initial_retained_volume_ml: 0.0
      syringe_safety_margin_ml: 1.0
      units: mL/min
      rate_ml_min: 5.0
      default_volume_ml: 5.0
    "2":
      syringe_diameter_mm: 12.06
      syringe_capacity_ml: 5.0
      initial_retained_volume_ml: 2.0
      syringe_safety_margin_ml: 0.2
      units: mL/min
      rate_ml_min: 1.0
      default_volume_ml: 1.8
nmr:
  route: iflow
  result_type: fid
  scans: 8
  receiver_gain: 12.0
  auto_gain: false
  spectral_center: 5.0
  sweep_width: 20.0
  target_ppm: 5.8
analysis:
  area_epsilon: 1.0e-12
  peak_tracking:
    search: {"enabled": true, "half_width_ppm": 0.2}
    previous_shift: {"enabled": true, "maximum_ppm": 0.08}
    reference_shift: {"enabled": false, "maximum_ppm": 0.15}
    continuity: {"enabled": true}
    absolute_prominence: {"enabled": false, "minimum": 0.0}
    snr: {"enabled": true, "minimum": 5.0}
    prominence: {"enabled": true, "minimum_snr": 5.0}
    width: {"enabled": true, "minimum_ppm": 0.015, "maximum_ppm": 0.167}
    separation: {"enabled": true, "minimum_ppm": 0.04}
    height: {"enabled": false, "minimum": 0.0}
    area: {"enabled": true, "minimum": 1.0e-12}
    shoulder: {"enabled": false, "maximum_asymmetry": 0.5}
    slope: {"enabled": false, "minimum_flank_fraction": 0.05}
    shape: {"enabled": false, "minimum_interpolation_quality": 0.8}
    neighbor: {"enabled": false, "minimum_distance_widths": 2.0}
  measurement_qc:
    noise_multiplier: 3.0
    max_noise_fraction: 0.01
    max_area_uncertainty_fraction: 0.005
    undetected_max_fraction: 0.025
output:
  run_root_dir: results/runs/si6_two_stage
three_instrument:
  test_withdraw_ml: 0.5
  test_infuse_ml: 0.5
  initial_plateau_stopping_enabled: true
