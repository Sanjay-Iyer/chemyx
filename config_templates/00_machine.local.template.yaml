# Copy to configs/machines/00_machine.local.yaml on each computer.
# Fill in only verified endpoints. Null deliberately avoids using a historical
# COM port or NMR address on a different laptop.
chemyx:
  serial_port: null # REQUIRED for live pump use: verify the pump's COM port
  baud_rate: 115200 # VERIFY against the pump configuration
  timeout_seconds: 2.0
  response_delay_seconds: 0.2

nmr:
  host: null # REQUIRED for live NMR use: verify IP address or hostname
  port: 5000 # VERIFY against the NMR RPC service
  scheme: http
  timeout_seconds: 10.0
  poll_seconds: 2.0
  max_wait_seconds: 300.0

valve:
  serial_port: null # Optional: only set if the separate valve is installed
  baud_rate: 19200
  positions: 2
  timeout_seconds: 1.0
  motion_timeout_seconds: 10.0
